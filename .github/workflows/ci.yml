# Same checks as .githooks/pre-push, run on GitHub for every push and PR.
name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Generate Next.js types (next-env.d.ts, route types)
              run: npx next typegen
            - name: Type-check
              run: npx tsc --noEmit
            - name: Format check
              run: npx prettier --check .
            - name: Unit tests
              run: npm test
